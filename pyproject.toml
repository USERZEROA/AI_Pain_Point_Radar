[project]
name = "ai-pain-point-radar"
version = "1.0.0"
description = "Real AI-user feedback streamed through Apache Kafka into PostgreSQL and Streamlit"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: requires the real PostgreSQL TEST_DATABASE_URL"]
