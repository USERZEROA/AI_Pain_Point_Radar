[theme]
base = "light"
primaryColor = "#6558F5"
backgroundColor = "#F6F8FC"
secondaryBackgroundColor = "#EDF1F8"
textColor = "#172A46"
font = "sans serif"

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
