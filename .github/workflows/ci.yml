name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_runner
          POSTGRES_DB: radar_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_runner -d radar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://test_runner@127.0.0.1:5432/radar_test
      - name: Test the Compose pipeline
        run: |
          python scripts/start.py --no-start
          docker compose config --quiet
          docker compose build dashboard
          docker compose up -d --no-build --wait dashboard storage-consumer analysis-consumer
          docker compose exec -T analysis-consumer python scripts/smoke_test.py
          curl --fail http://127.0.0.1:8501/_stcore/health
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --tail 100
